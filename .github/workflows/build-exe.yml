name: Build Windows EXE

on:
  push:
    branches: ["claude/nvr-blackout-detector-exe-zhf83d", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Import check (Windows modules + tkinter GUI)
        working-directory: nvr_inspector
        run: python -c "import winutil, capture, gui, roi_dialog, roi_editor, settings_dialog, alert; print('imports ok')"

      - name: GUI smoke test (모든 창 생성/동작)
        run: python tests/smoke_gui.py

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean "NVR_흑변_검출기.spec"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NVR_검출기_EXE
          path: dist/*.exe
          if-no-files-found: error
