name: Build Windows EXE

on:
  push:
    branches: ["claude/nvr-blackout-detector-exe-zhf83d", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Translation check (한국어/영어 누락 검사)
        run: python tests/check_i18n.py

      - name: Import check (Windows modules + tkinter GUI)
        working-directory: nvr_inspector
        run: python -c "import i18n; i18n.set_language('en'); import winutil, capture, gui, roi_dialog, roi_editor, settings_dialog, alert; print('imports ok')"

      - name: Set screen resolution (실제 모니터 크기로 미리보기)
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: GUI smoke test (모든 창 생성/동작)
        run: python tests/smoke_gui.py

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean "FMVS_Vision_Agent.spec"

      - name: Upload dashboard preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard_preview
          path: ci_artifacts/
          if-no-files-found: ignore

      - name: Publish preview images to branch (리뷰용)
        if: always()
        shell: bash
        run: |
          [ -d ci_artifacts ] || exit 0
          cd ci_artifacts
          git init -q -b preview
          git config user.name "ci-preview"
          git config user.email "ci-preview@users.noreply.github.com"
          git add -A
          git commit -qm "dashboard preview for ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            preview:refs/heads/claude/nvr-blackout-detector-exe-zhf83d-preview

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FMVS_Vision_Agent_EXE
          path: dist/*.exe
          if-no-files-found: error
